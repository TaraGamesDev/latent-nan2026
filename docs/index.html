<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>CADENCE — 매 순간을 설계하는 화살표 퍼즐</title>
    <meta
      name="description"
      content="AI 디렉터가 매 탭마다 당신의 실력을 다시 재고, 다음 순간을 설계합니다."
    />
    <meta name="theme-color" content="#090b11" />
    <script type="module" crossorigin src="./assets/index-BFquQpyS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DF68Fo9Z.css">
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="hud-top">
          <div class="brand">
            <span class="brand-name">CADENCE</span>
            <span class="brand-sub">AI DIRECTED</span>
          </div>
          <button id="panel-toggle" class="ghost-btn" aria-expanded="false">
            AI 패널 <kbd>D</kbd>
          </button>
        </div>

        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">점수</span>
            <span class="stat-value" id="score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">콤보</span>
            <span class="stat-value" id="combo">—</span>
          </div>
          <div class="stat stat-wide">
            <span class="stat-label">압력 <b id="intensity-pct">0%</b></span>
            <div class="meter"><i id="intensity-bar"></i></div>
          </div>
        </div>
      </header>

      <main class="stage">
        <div class="board-wrap">
          <canvas id="board" aria-label="게임 보드"></canvas>
        </div>
        <p class="hint" id="hint">
          화살표를 누르면 그 방향으로 미끄러집니다. 판 밖으로 나가면 득점.
        </p>
      </main>

      <section id="gameover" class="overlay" hidden>
        <div class="overlay-card">
          <h2 id="go-title">보드가 막혔습니다</h2>
          <div class="go-stats">
            <div><span>점수</span><b id="go-score">0</b></div>
            <div><span>탭</span><b id="go-taps">0</b></div>
            <div><span>탈출</span><b id="go-exits">0</b></div>
            <div><span>최고 콤보</span><b id="go-combo">0</b></div>
          </div>
          <p class="go-read" id="go-read"></p>
          <button id="restart" class="primary-btn">다시 하기</button>
        </div>
      </section>

      <aside id="panel" class="panel" hidden>
        <div class="panel-head">
          <h2>AI 디렉터</h2>
          <button id="panel-close" class="ghost-btn" aria-label="패널 닫기">✕</button>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>

  </body>
</html>
